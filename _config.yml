title: Enterprise Agent Platform
description: >-
  Vision, enterprise capabilities, architecture choices and implementation
  roadmap for an open, governed and scalable enterprise agent platform.
theme: just-the-docs
url: ""
baseurl: ""

color_scheme: agentplatform
search_enabled: true
search:
  heading_level: 2
  previews: 2
  tokenizer_separator: /[\s\-/]+/

heading_anchors: true

aux_links:
  "View on GitHub":
    - "https://github.com/denniszielke/agent-platform-enterprise-concept"
aux_links_new_tab: true

nav_external_links:
  - title: Repository
    url: https://github.com/denniszielke/agent-platform-enterprise-concept

footer_content: >-
  Conceptual reference material for enterprise agent platforms. Provided as-is
  for architecture discussions.

callouts:
  note:
    title: Note
    color: blue
  highlight:
    title: Key point
    color: purple
  warning:
    title: Watch out
    color: red

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
