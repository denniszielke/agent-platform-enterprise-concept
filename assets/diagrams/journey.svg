<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 250" width="1240" height="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Journey from vision through capabilities and architecture to roadmap"><title>Journey from vision through capabilities and architecture to roadmap</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b5cad"/><stop offset="100%" stop-color="#4a2f8f"/></linearGradient></defs><rect width="1240" height="250" fill="#ffffff"/><text x="40" y="50" font-size="22" font-weight="700" fill="#10243e" text-anchor="start">From vision to production value</text><rect x="40" y="90" width="240" height="90" rx="10" fill="url(#g)" stroke="#0b5cad" stroke-width="2"/><text x="160.0" y="131.0" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Vision</text><text x="160.0" y="151.0" text-anchor="middle" font-size="12" fill="#44546a">Why we build the platform</text><defs><marker id="a288135332135" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0b5cad"/></marker></defs><line x1="288" y1="135" x2="332" y2="135" stroke="#0b5cad" stroke-width="2" marker-end="url(#a288135332135)"/><rect x="340" y="90" width="240" height="90" rx="10" fill="#eef3fb" stroke="#0b5cad" stroke-width="2"/><text x="460.0" y="131.0" text-anchor="middle" font-size="15" font-weight="600" fill="#10243e">Capabilities</text><text x="460.0" y="151.0" text-anchor="middle" font-size="12" fill="#44546a">24 committed capabilities</text><defs><marker id="a588135632135" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0b5cad"/></marker></defs><line x1="588" y1="135" x2="632" y2="135" stroke="#0b5cad" stroke-width="2" marker-end="url(#a588135632135)"/><rect x="640" y="90" width="240" height="90" rx="10" fill="#eef3fb" stroke="#0b5cad" stroke-width="2"/><text x="760.0" y="131.0" text-anchor="middle" font-size="15" font-weight="600" fill="#10243e">Architecture</text><text x="760.0" y="151.0" text-anchor="middle" font-size="12" fill="#44546a">Centralised or federated</text><defs><marker id="a888135932135" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0b5cad"/></marker></defs><line x1="888" y1="135" x2="932" y2="135" stroke="#0b5cad" stroke-width="2" marker-end="url(#a888135932135)"/><rect x="940" y="90" width="240" height="90" rx="10" fill="#eef3fb" stroke="#0b5cad" stroke-width="2"/><text x="1060.0" y="131.0" text-anchor="middle" font-size="15" font-weight="600" fill="#10243e">Roadmap</text><text x="1060.0" y="151.0" text-anchor="middle" font-size="12" fill="#44546a">Incremental delivery</text><text x="40" y="220" font-size="13" fill="#44546a" text-anchor="start" font-weight="400">Each stage reuses the same capability model, so implementation choices never restart the conversation.</text></svg>