<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 480" width="1160" height="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Centralised operating model with one central platform and delivery team"><title>Centralised operating model with one central platform and delivery team</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b5cad"/><stop offset="100%" stop-color="#4a2f8f"/></linearGradient></defs><rect width="1160" height="480" fill="#ffffff"/><text x="40" y="46" font-size="22" font-weight="700" fill="#10243e" text-anchor="start">Centralised operating model</text><rect x="40" y="80" width="1080" height="90" rx="10" fill="url(#g)" stroke="#0b5cad" stroke-width="2"/><text x="580.0" y="121.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Central platform team</text><text x="580.0" y="141.0" text-anchor="middle" font-size="12" fill="#44546a">Owns runtimes, gateway, policy, identity, observability and cost model end to end</text><rect x="40" y="210" width="340" height="90" rx="10" fill="#eef3fb" stroke="#0b5cad" stroke-width="2"/><text x="210.0" y="251.0" text-anchor="middle" font-size="15" font-weight="600" fill="#10243e">Intake &amp; prioritisation</text><text x="210.0" y="271.0" text-anchor="middle" font-size="12" fill="#44546a">Business demand queue</text><defs><marker id="a392255400255" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0b5cad"/></marker></defs><line x1="392" y1="255" x2="400" y2="255" stroke="#0b5cad" stroke-width="2" marker-end="url(#a392255400255)"/><rect x="410" y="210" width="340" height="90" rx="10" fill="#eef3fb" stroke="#0b5cad" stroke-width="2"/><text x="580.0" y="251.0" text-anchor="middle" font-size="15" font-weight="600" fill="#10243e">Central build &amp; release</text><text x="580.0" y="271.0" text-anchor="middle" font-size="12" fill="#44546a">Single delivery pipeline</text><defs><marker id="a762255770255" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0b5cad"/></marker></defs><line x1="762" y1="255" x2="770" y2="255" stroke="#0b5cad" stroke-width="2" marker-end="url(#a762255770255)"/><rect x="780" y="210" width="340" height="90" rx="10" fill="#eef3fb" stroke="#0b5cad" stroke-width="2"/><text x="950.0" y="251.0" text-anchor="middle" font-size="15" font-weight="600" fill="#10243e">Central operations</text><text x="950.0" y="271.0" text-anchor="middle" font-size="12" fill="#44546a">One on-call and cost owner</text><rect x="40" y="340" width="340" height="70" rx="10" fill="#f4f7fb" stroke="#0b5cad" stroke-width="2"/><text x="210.0" y="371.0" text-anchor="middle" font-size="15" font-weight="600" fill="#10243e">Domain team A</text><text x="210.0" y="391.0" text-anchor="middle" font-size="12" fill="#44546a">Consumes agents and services</text><rect x="410" y="340" width="340" height="70" rx="10" fill="#f4f7fb" stroke="#0b5cad" stroke-width="2"/><text x="580.0" y="371.0" text-anchor="middle" font-size="15" font-weight="600" fill="#10243e">Domain team B</text><text x="580.0" y="391.0" text-anchor="middle" font-size="12" fill="#44546a">Consumes agents and services</text><rect x="780" y="340" width="340" height="70" rx="10" fill="#f4f7fb" stroke="#0b5cad" stroke-width="2"/><text x="950.0" y="371.0" text-anchor="middle" font-size="15" font-weight="600" fill="#10243e">Domain team C</text><text x="950.0" y="391.0" text-anchor="middle" font-size="12" fill="#44546a">Consumes agents and services</text><text x="40" y="450" font-size="13" fill="#44546a" text-anchor="start" font-weight="400">Strongest consistency and control; central team can become the delivery bottleneck.</text></svg>