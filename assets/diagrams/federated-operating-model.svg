<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 490" width="1160" height="490" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Federated operating model with domain teams on a central paved road"><title>Federated operating model with domain teams on a central paved road</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b5cad"/><stop offset="100%" stop-color="#4a2f8f"/></linearGradient></defs><rect width="1160" height="490" fill="#ffffff"/><text x="40" y="46" font-size="22" font-weight="700" fill="#10243e" text-anchor="start">Federated operating model</text><rect x="40" y="80" width="1080" height="90" rx="10" fill="url(#g)" stroke="#0b5cad" stroke-width="2"/><text x="580.0" y="121.0" text-anchor="middle" font-size="17" font-weight="600" fill="#ffffff">Central platform team owns the paved road</text><text x="580.0" y="141.0" text-anchor="middle" font-size="12" fill="#44546a">Standards, shared control plane, golden paths, guardrails and evidence</text><rect x="40" y="210" width="340" height="110" rx="10" fill="#eef3fb" stroke="#0b5cad" stroke-width="2"/><text x="210.0" y="261.0" text-anchor="middle" font-size="15" font-weight="600" fill="#10243e">Domain team A</text><text x="210.0" y="281.0" text-anchor="middle" font-size="12" fill="#44546a">Builds and operates its own agents</text><defs><marker id="a210175210205" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0b5cad"/></marker></defs><line x1="210" y1="175" x2="210" y2="205" stroke="#0b5cad" stroke-width="2" marker-end="url(#a210175210205)"/><rect x="410" y="210" width="340" height="110" rx="10" fill="#eef3fb" stroke="#0b5cad" stroke-width="2"/><text x="580.0" y="261.0" text-anchor="middle" font-size="15" font-weight="600" fill="#10243e">Domain team B</text><text x="580.0" y="281.0" text-anchor="middle" font-size="12" fill="#44546a">Builds and operates its own agents</text><defs><marker id="a580175580205" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0b5cad"/></marker></defs><line x1="580" y1="175" x2="580" y2="205" stroke="#0b5cad" stroke-width="2" marker-end="url(#a580175580205)"/><rect x="780" y="210" width="340" height="110" rx="10" fill="#eef3fb" stroke="#0b5cad" stroke-width="2"/><text x="950.0" y="261.0" text-anchor="middle" font-size="15" font-weight="600" fill="#10243e">Domain team C</text><text x="950.0" y="281.0" text-anchor="middle" font-size="12" fill="#44546a">Builds and operates its own agents</text><defs><marker id="a950175950205" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#0b5cad"/></marker></defs><line x1="950" y1="175" x2="950" y2="205" stroke="#0b5cad" stroke-width="2" marker-end="url(#a950175950205)"/><rect x="40" y="355" width="1080" height="70" rx="10" fill="#f4f7fb" stroke="#0b5cad" stroke-width="2"/><text x="580.0" y="386.0" text-anchor="middle" font-size="15" font-weight="600" fill="#10243e">Federated governance board</text><text x="580.0" y="406.0" text-anchor="middle" font-size="12" fill="#44546a">Shared policy, architecture review, capability maturity and chargeback</text><text x="40" y="465" font-size="13" fill="#44546a" text-anchor="start" font-weight="400">Fastest domain delivery; requires strong guardrails, telemetry and capability maturity to stay aligned.</text></svg>