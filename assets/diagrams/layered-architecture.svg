<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 640" width="1220" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Layered architecture from enterprise foundations to experience channels"><title>Layered architecture from enterprise foundations to experience channels</title><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0b5cad"/><stop offset="100%" stop-color="#4a2f8f"/></linearGradient></defs><rect width="1220" height="640" fill="#ffffff"/><text x="40" y="46" font-size="22" font-weight="700" fill="#10243e" text-anchor="start">Layered platform architecture</text><rect x="40" y="75" width="1140" height="72" rx="10" fill="#eef3fb" stroke="#0b5cad" stroke-width="2"/><text x="610.0" y="107.0" text-anchor="middle" font-size="16" font-weight="600" fill="#10243e">Experience &amp; channels</text><text x="610.0" y="127.0" text-anchor="middle" font-size="12" fill="#44546a">Copilot surfaces, web and mobile apps, contact centre, line-of-business systems</text><rect x="40" y="163" width="1140" height="72" rx="10" fill="#eef3fb" stroke="#0b5cad" stroke-width="2"/><text x="610.0" y="195.0" text-anchor="middle" font-size="16" font-weight="600" fill="#10243e">Agent &amp; orchestration runtimes</text><text x="610.0" y="215.0" text-anchor="middle" font-size="12" fill="#44546a">Agent hosting, workflow orchestration, agent memory, evaluation harnesses</text><rect x="40" y="251" width="1140" height="72" rx="10" fill="#eef3fb" stroke="#0b5cad" stroke-width="2"/><text x="610.0" y="283.0" text-anchor="middle" font-size="16" font-weight="600" fill="#10243e">Intelligence services</text><text x="610.0" y="303.0" text-anchor="middle" font-size="12" fill="#44546a">Model gateway, semantic foundation, knowledge and data products, prompt assets</text><rect x="40" y="339" width="1140" height="72" rx="10" fill="#eef3fb" stroke="#0b5cad" stroke-width="2"/><text x="610.0" y="371.0" text-anchor="middle" font-size="